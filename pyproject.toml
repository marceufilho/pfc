[project]
name = "pfc"
version = "0.1.0"
description = "Proof-guided compiler for a restricted C subset"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "openai>=3.46.0",
    "pycparser>=3.12",
    "z3-solver==5.3.3.0",
]

[project.scripts]
pfc = "pfc.cli:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pfc"]

[tool.hatch.build.targets.wheel.force-include]
"include" = "pfc/_resources/include"
"tools/fake_libc" = "pfc/_resources/fake_libc"

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: exercises real external tools (Z3 or clang)"]

[tool.mypy]
python_version = "3.11"
files = ["pfc"]
strict = true

[[tool.mypy.overrides]]
# z3-solver does not ship PEP 561 typing metadata. Keep the exception at its boundary.
module = ["z3", "z3.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# pycparser 3.12 has inline annotations but no py.typed marker or published stubs.
# Analyze those annotations; the few untyped AST methods are adapted at our boundary.
module = ["pycparser", "pycparser.*"]
follow_untyped_imports = true

[dependency-groups]
dev = [
    "black>=26.10.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
